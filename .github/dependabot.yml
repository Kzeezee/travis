# Actions are pinned to full commit SHAs (a mutable third-party tag in this project's
# pipeline is the bug class the project exists to prevent); Dependabot is what keeps
# those pins from going stale.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
    groups:
      go-dependencies:
        patterns:
          - "*"
