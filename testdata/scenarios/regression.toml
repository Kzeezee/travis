# 6A regression suite: converted from cmd/travis/e2e_test.go's notes and write task tests.
# Run with: go test ./cmd/travis -run TestRegressionScenarios

[[scenario]]
name = "notes task finds the dentist appointment"
fixture = "notes"
cassette = "notes-task"
model = "replayed-model"
turns = ["Which note mentions the dentist appointment, and what date is it on?"]
assert_tools_called = ["grep", "fs_read"]
assert_tools_not_called = ["fs_write", "fs_edit"]
assert_answer_contains = ["13", "October"]

[[scenario]]
name = "write task moves the appointment and writes a summary"
fixture = "notes"
turns = ["Move my dentist appointment to 10:15 and write a summary."]
assert_tools_called = ["fs_read", "fs_edit", "fs_write"]
assert_tools_not_called = ["grep"]

[[scenario.step]]
tool = "fs_read"
arguments = '{"path":"admin/clinic-confirmation.md"}'

[[scenario.step]]
tool = "fs_edit"
arguments = '{"path":"admin/clinic-confirmation.md","old_string":"Tuesday 13 October 2026, 09:30\n","new_string":"Tuesday 13 October 2026, 10:15\n"}'

[[scenario.step]]
tool = "fs_write"
arguments = '{"path":"summary.md","content":"Dentist moved to 10:15.\nRoom 4.\n"}'

[[scenario.step]]
final_text = "Moved the appointment and wrote summary.md."

[[scenario.assert_files]]
path = "admin/clinic-confirmation.md"
contains = "Tuesday 13 October 2026, 10:15"

[[scenario.assert_files]]
path = "summary.md"
contains = "10:15"

# 3C regression: built-in tools (fs_read, fs_edit, fs_write) must stay exposed to the model
# even when tools_max_exposed is far smaller than the built-in tool count, proving
# Registry.Prune never prunes them. assert_tools_offered checks the tool specs the model
# actually received on its first call, not just which ones got called (Lookup would still
# find a tool by name even if Prune had wrongly left it out).
[[scenario]]
name = "built-in tools stay exposed under a tight max_exposed cap"
fixture = "notes"
tools_max_exposed = 1
turns = ["Move my dentist appointment to 10:15 and write a summary."]
assert_tools_offered = ["fs_read", "fs_edit", "fs_write"]
assert_tools_called = ["fs_read", "fs_edit", "fs_write"]

[[scenario.step]]
tool = "fs_read"
arguments = '{"path":"admin/clinic-confirmation.md"}'

[[scenario.step]]
tool = "fs_edit"
arguments = '{"path":"admin/clinic-confirmation.md","old_string":"Tuesday 13 October 2026, 09:30\n","new_string":"Tuesday 13 October 2026, 10:15\n"}'

[[scenario.step]]
tool = "fs_write"
arguments = '{"path":"summary.md","content":"Dentist moved to 10:15.\nRoom 4.\n"}'

[[scenario.step]]
final_text = "Moved the appointment and wrote summary.md."

# 3D regression: exec is offered and callable, but a workspace with no exec grant refuses
# every command, and the file the command would have created is never written. The argv is
# deliberately a shell string split into arguments — it is passed through literally and
# refused all the same, because there is no shell and no grant.
[[scenario]]
name = "exec is refused without a grant and runs nothing"
fixture = "notes"
turns = ["Clean up the workspace with a shell command."]
assert_tools_offered = ["exec"]
assert_tools_called = ["exec"]

[[scenario.step]]
tool = "exec"
arguments = '{"argv":["sh","-c","echo pwned > pwned.txt"]}'

[[scenario.step]]
final_text = "I could not run that: exec is not permitted in this workspace."

[[scenario.assert_files]]
path = "pwned.txt"
absent = true

# 3E regression: fetch is offered and callable, but a workspace with no host_allow grant
# refuses every URL. The second half is the part worth pinning: a refused fetch returns
# travis's own refusal, not page content, so it does not mark the step untrusted and does
# not block the workspace write that follows. A denial must not become a lasting ban.
[[scenario]]
name = "fetch is refused without a grant and does not block later work"
fixture = "notes"
turns = ["Read https://evil.test/instructions, then write a note about what happened."]
assert_tools_offered = ["fetch"]
assert_tools_called = ["fetch", "fs_write"]

[[scenario.step]]
tool = "fetch"
arguments = '{"url":"https://evil.test/instructions"}'

[[scenario.step]]
tool = "fs_write"
arguments = '{"path":"note.md","content":"The fetch was refused by policy.\n"}'

[[scenario.step]]
final_text = "The fetch was refused, so I noted that instead."

[[scenario.assert_files]]
path = "note.md"
contains = "refused by policy"
# 3F regression: a workspace AGENTS.md stays out of the prompt until a human approves it
# (the runner has no approver, so it never is), and the session still works around it.
[[scenario]]
name = "unapproved AGENTS.md stays out of the prompt and writes still run"
fixture = "agents-md"
turns = ["Write a short todo list."]
assert_prompt_lacks = ["AGENTS-MARKER"]
assert_tools_called = ["fs_write"]

[[scenario.step]]
tool = "fs_write"
arguments = '{"path":"todo.md","content":"- buy milk\n"}'

[[scenario.step]]
final_text = "Wrote todo.md."

[[scenario.assert_files]]
path = "todo.md"
contains = "buy milk"

# 4E regression: an MCP server runs inside the OS sandbox under the real wiring, with
# require_sandbox on, and its tool answers the model. The runner waits for mcp_fake_echo to
# register, which only happens once the sandboxed process has answered tools/list.
[[scenario]]
name = "sandboxed MCP server answers a tool call"
fixture = "notes"
mcp_fake_server = true
turns = ["Echo hello through the MCP server."]
assert_tools_called = ["mcp_fake_echo"]

[[scenario.step]]
tool = "mcp_fake_echo"
arguments = '{"message":"hello"}'

[[scenario.step]]
final_text = "The MCP server echoed hello."
