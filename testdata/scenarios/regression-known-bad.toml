# Deliberately wrong scenarios: each one runs cleanly but asserts something that cannot be
# true, so TestKnownBadScenariosFail can prove the harness actually catches a broken
# assertion instead of passing vacuously. Run with:
# go test ./cmd/travis -run TestKnownBadScenariosFail

[[scenario]]
name = "known bad: asserts a tool that was never called"
fixture = "notes"
cassette = "notes-task"
model = "replayed-model"
turns = ["Which note mentions the dentist appointment, and what date is it on?"]
assert_tools_called = ["exec"]

[[scenario]]
name = "known bad: asserts the wrong file content"
fixture = "notes"
turns = ["Move my dentist appointment to 10:15 and write a summary."]

[[scenario.step]]
tool = "fs_read"
arguments = '{"path":"admin/clinic-confirmation.md"}'

[[scenario.step]]
tool = "fs_edit"
arguments = '{"path":"admin/clinic-confirmation.md","old_string":"Tuesday 13 October 2026, 09:30\n","new_string":"Tuesday 13 October 2026, 10:15\n"}'

[[scenario.step]]
tool = "fs_write"
arguments = '{"path":"summary.md","content":"Dentist moved to 10:15.\nRoom 4.\n"}'

[[scenario.step]]
final_text = "Moved the appointment and wrote summary.md."

[[scenario.assert_files]]
path = "summary.md"
contains = "this text never appears in the summary"

# Known bad: asserts a file is absent that the scripted steps demonstrably write. It proves
# the absent-file assertion the 3D exec scenario relies on is actually checking something.
[[scenario]]
name = "known bad: asserts a written file is absent"
fixture = "notes"
turns = ["Write a summary."]

[[scenario.step]]
tool = "fs_write"
arguments = '{"path":"summary.md","content":"written\n"}'

[[scenario.step]]
final_text = "Wrote summary.md."

[[scenario.assert_files]]
path = "summary.md"
absent = true

# Known bad (TRA-73): asserts spoken text the reply never contains, proving
# assert_speech_contains is actually checked rather than passing vacuously.
[[scenario]]
name = "known bad: asserts speech that was never spoken"
fixture = "notes"
voice_output_enabled = true
turns = ["Is the dentist appointment confirmed?"]
assert_speech_contains = ["this text was never spoken"]

[[scenario.step]]
final_text = "All set. <speak>The appointment is confirmed for 10:15.</speak>"
