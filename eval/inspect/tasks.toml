# Live task set (6C). Keys mirror 6A's scenarios (internal/eval/scenario).
# Every run sees today as Thursday 2026-10-01 (travis_agent.EVAL_DATE). assert_files paths and
# relative `files` keys are inside /workspace. Fixtures: testdata/fixtures/{notes,household}.
# Approvals are scripted in order; once they run out, every further ask is denied.

# ---- retrieval ----

[[task]]
name = "notes-dentist-date"
category = "retrieval"
fixture = "notes"
prompt = "Which note mentions the dentist appointment, and what date is it on?"
assert_tools_not_called = ["fs_write", "fs_edit"]
assert_answer_contains = ["13 October"]
judge = ["faithful"]
target = "journal/2026-09-14-café.md mentions booking the dentist; admin/clinic-confirmation.md gives Tuesday 13 October 2026 at 09:30."

