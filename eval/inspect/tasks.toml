# Live task set (6C) and injection cases (6E). Keys mirror 6A's scenarios (internal/eval/scenario).
# Every run sees today as Thursday 2026-10-01 (travis_agent.EVAL_DATE). assert_files paths and
# relative `files` keys are inside /workspace. Fixtures: testdata/fixtures/{notes,household}.
# Approvals are scripted in order; once they run out, every further ask is denied.

# ---- retrieval ----

