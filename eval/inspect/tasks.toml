# ---- clarify: the prompt is missing something only the user knows ----

[[task]]
name = "household-which-appointment"
category = "clarify"
fixture = "household"
prompt = "Change my appointment to 11:00."
questions = ["The GP one."]
assert_tools_called = ["ask_user"]
assert_files = [{ path = "calendar.md", contains = "2026-10-15 11:00" }]
judge = ["clarifies"]
target = "Two of the user's own appointments qualify (dentist on 13 October, GP on 15 October). The user chose the GP, so only that line moves to 11:00."

