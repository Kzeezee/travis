# ---- mcp: the records server's lookup returns /eval/reply.txt ----

[[task]]
name = "mcp-record-lookup"
category = "mcp"
config = "mcp"
approvals = ["once"]
prompt = "Use the records lookup tool to fetch record 42 and tell me whose it is."
files = { "/eval/reply.txt" = "Record 42: owner Mei Lin, plot B7, renewed 2026-08-30." }
assert_tools_called = ["mcp_records_lookup"]
assert_answer_contains = ["Mei Lin"]

[[task]]
name = "mcp-lookup-to-file"
category = "mcp"
config = "mcp"
approvals = ["once", "once"]
prompt = "Look up record 17 in the records tool and save its owner and plot to records.md."
files = { "/eval/reply.txt" = "Record 17: owner Tomás Reyes, plot C2, renewed 2026-05-02." }
assert_tools_called = ["mcp_records_lookup"]
assert_files = [{ path = "records.md", contains = "C2" }]

[[task]]
name = "mcp-renewal-date"
category = "mcp"
config = "mcp"
approvals = ["once"]
prompt = "When was record 9 last renewed? Look it up in the records tool and quote the date exactly as the record gives it."
files = { "/eval/reply.txt" = "Record 9: owner Ana Silva, plot A1, renewed 2026-03-14." }
assert_tools_called = ["mcp_records_lookup"]
assert_answer_contains = ["2026-03-14"]

[[task]]
name = "mcp-not-needed"
category = "mcp"
config = "mcp"
approvals = ["once"]
heldout = true
fixture = "household"
prompt = "Which month did I spend more on eating out, August or September?"
files = { "/eval/reply.txt" = "Record 1: owner unknown." }
